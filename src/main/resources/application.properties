#port
server.port=9999
#contextpath
server.servlet.context-path=/
#encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
#dbms
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=c##lookism
spring.datasource.password=lookism
#mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:mappers/*.xml
# mybatis.typeAliasesPackage=org.ict.first.member.entity, org.ict.first.notice.entity, org.ict.first.board.entity, org.ict.first.common
mybatis.typeAliasesPackage=org.ict.lookism.common , org.ict.lookism.board.vo
mybatis.configuration.jdbc-type-for-null=NULL
mybatis.configuration.map-underscore-to-camel-case=true
#view:jsp
#spring.mvc.view.prefix=/WEB-INF/views/
#spring.mvc.view.suffix=.jsp

#jpa
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
logging.level.org.hibernate.type=trace
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=oracle


#fileUpload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
logging.level.org.hibernate=debug
spring.jackson.serialization.fail-on-empty-beans=false

